<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formularioActividad.css">
    <title>Formulario Actividad</title>
</head>

<body>
    <header>
        <h1>Formulario de Actividad</h1>
    </header>
    <section>
        <div class="container">

            <h2>Formulario de Producto</h2>

            <form action="" method="get" class="form-container" id="productoForm">
                <div class="form-group">
                    <label for="nombre">Nombre del Producto:</label>
                    <input type="text" id="nombre" placeholder="Ingrese el nombre" required min="1" max="10000000">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="electronica">Electrónica</option>
                        <option value="ropa">Ropa</option>
                        <option value="hogar">Hogar</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" placeholder="Ingrese una descripción" required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="imagen">Imagen del Producto:</label>
                    <input type="file" id="imagen" accept="image/*">
                    <img class="preview-img" id="previewImg" alt="Vista Previa">
                </div>

                <div class="button-container">
                    <button id="btnAgregar" type="submit">Registrar Producto</button>
                </div>

            </form>

        </div>
    </section>

    <script src="js/formularioActividad.js"></script>
</body>

</html>
