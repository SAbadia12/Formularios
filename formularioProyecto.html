<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formularioProyecto.css">
    <title>Formulario Proyecto</title>
</head>

<body>
    <header>
        <h1>Formulario de Proyecto</h1>
    </header>
    <section>
        <div class="container">

            <h2>Formulario de Recomendación</h2>

            <form action="" method="get" class="form-container" id="productoForm">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ingrese su nombre" required min="1" max="10000000">
                </div>

                <div class="form-group full-width">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" placeholder="Ingrese su mensaje" required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="tratamientoDatos">
                        <input type="checkbox" id="tratamientoDatos" required>
                        Acepto el tratamiento de datos
                    </label>
                </div>

                <div class="button-container">
                    <button id="btnAgregar" type="submit">Registrar Proyecto</button>
                </div>

            </form>

        </div>
    </section>

    <script src="js/formularioProyecto.js"></script>
</body>

</html>
